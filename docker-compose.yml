services:
  backend:
    build: ./backend
    container_name: clarity-backend
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}

  frontend:
    build: ./frontend
    container_name: clarity-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
